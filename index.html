<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SegundaChance</title>
    <meta
      name="description"
      content="Um marketplace peer-to-peer focado no mercado angolano/lusófono para vender e comprar pertences de forma simples, segura e intuitiva."
    />
    <meta property="og:title" content="SegundaChance" />
    <meta
      property="og:description"
      content="Um marketplace peer-to-peer focado no mercado angolano/lusófono para vender e comprar pertences de forma simples, segura e intuitiva."
    />
    <script>
      if (typeof global === 'undefined') {
        var global = window;
      }
      try {
        var savedTheme = localStorage.getItem('sc_theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
