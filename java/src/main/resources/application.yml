server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: kuenda-marketplace-backend
  datasource:
    url: jdbc:h2:mem:kuendadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Configurações de CORS, Segurança JWT e Configuração Híbrida Multi-Provedor Spring AI
app:
  jwt:
    secret: "${JWT_SECRET}"
    expiration-ms: 86400000 # 24 horas em milissegundos
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"
      - "http://localhost:5173"
      - "https://*.run.app"
  ai:
    # Opções: HYBRID (auto-seleciona pela chave disponível), GEMINI ou OPENAI
    provider: "${AI_PROVIDER:HYBRID}"
    gemini:
      api-key: "${GEMINI_API_KEY:}"
      model: "${GEMINI_MODEL:gemini-3.8-flash}"
    openai:
      api-key: "${OPENAI_API_KEY:}"
      base-url: "${OPENAI_BASE_URL:https://api.openai.com/v1}"
      model: "${OPENAI_MODEL:gpt-4o-mini}"
