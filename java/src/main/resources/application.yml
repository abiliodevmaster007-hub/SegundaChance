server:
  port: "${PORT:8080}"
  servlet:
    context-path: /

spring:
  application:
    name: kuenda-marketplace-backend
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:dev}"
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# Configurações de CORS, Segurança JWT, Bootstrap de Admin e Kuenda AI
app:
  jwt:
    secret: "${JWT_SECRET}"
    expiration-ms: "${JWT_EXPIRATION_MS:86400000}" # 24 horas em milissegundos
  admin:
    bootstrap:
      enabled: "${ADMIN_BOOTSTRAP_ENABLED:true}"
      email: "${ADMIN_BOOTSTRAP_EMAIL:}"
      password: "${ADMIN_BOOTSTRAP_PASSWORD:}"
      name: "${ADMIN_BOOTSTRAP_NAME:Administrador SegundaChance}"
      phone: "${ADMIN_BOOTSTRAP_PHONE:+244 923 000 000}"
      location: "${ADMIN_BOOTSTRAP_LOCATION:Luanda}"
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"
      - "http://localhost:5173"
      - "https://*.run.app"
  ai:
    provider: "${AI_PROVIDER:HYBRID}"
    gemini:
      api-key: "${GEMINI_API_KEY:}"
      model: "${GEMINI_MODEL:gemini-3.8-flash}"
    openai:
      api-key: "${OPENAI_API_KEY:}"
      base-url: "${OPENAI_BASE_URL:https://api.openai.com/v1}"
      model: "${OPENAI_MODEL:gpt-4o-mini}"
